<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hole Eater — Playable Ad</title>
    <script src="mraid.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #8fce00;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none; /* Prevents mobile scrolling while playing */
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        /* Compact ad chrome keeps the game clear on portrait screens. */
        .ad-topbar {
            position: absolute; z-index: 20; top: 0; left: 0; right: 0;
            display: flex; align-items: flex-start; justify-content: space-between;
            gap: 10px; padding: max(12px, env(safe-area-inset-top)) 12px 0;
            box-sizing: border-box; pointer-events: none;
        }
        .ad-brand {
            min-width: 0; padding: 10px 12px; border-radius: 16px;
            color: white; background: rgba(8, 22, 18, .82);
            border: 1px solid rgba(255,255,255,.2);
            box-shadow: 0 8px 26px rgba(0,0,0,.25);
        }
        .ad-brand strong { display: block; font-size: 15px; line-height: 1; letter-spacing: .06em; }
        .ad-brand strong span { color: #eaff65; }
        .ad-brand small { display: block; margin-top: 6px; font-size: 11px; color: #e7f8dd; }
        .ad-meter { height: 5px; margin-top: 8px; overflow: hidden; border-radius: 9px; background: rgba(255,255,255,.22); }
        #ad-meter-fill { display: block; width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg,#dfff54,#ffbc4c); transition: width .25s; }
        .ad-link {
            width: auto; min-width: 112px; margin: 0; padding: 10px 12px;
            border: 1px solid rgba(255,255,255,.8); border-radius: 13px;
            background: #eaff65; color: #14210a; font: 800 12px/1.1 'Segoe UI',sans-serif;
            box-shadow: 0 5px 0 #799b29, 0 9px 22px rgba(0,0,0,.25);
            text-transform: uppercase; letter-spacing: .04em; touch-action: manipulation;
        }
        .ad-link:hover, .ad-link:focus-visible { background: #f4ff9a; transform: translateY(-2px); }
        .ad-link:active { transform: translateY(3px); box-shadow: 0 2px 0 #799b29; }
        .ad-link.secondary { color: white; background: #202d2c; box-shadow: 0 5px 0 #0a1211, 0 9px 22px rgba(0,0,0,.25); }
        .ad-link.secondary:hover, .ad-link.secondary:focus-visible { background: #344845; }
        .ad-overlay {
            position: absolute; inset: 0; z-index: 30; display: flex; align-items: center;
            justify-content: center; padding: 24px; box-sizing: border-box;
            background: linear-gradient(145deg,rgba(7,25,22,.82),rgba(4,11,10,.94));
        }
        .ad-overlay[hidden] { display: none; }
        .ad-card {
            width: min(100%, 390px); padding: 25px 22px; box-sizing: border-box;
            text-align: center; color: white; border-radius: 26px;
            background: linear-gradient(160deg,#263c2b,#101d1c);
            border: 2px solid #a7d942; box-shadow: 0 18px 0 #09120e, 0 30px 70px rgba(0,0,0,.55);
        }
        .ad-orb { width: 72px; height: 72px; margin: 0 auto 18px; border-radius: 50%;
            background: radial-gradient(circle at 50% 50%,#020908 0 44%,#eaff65 45% 61%,#658e20 62% 100%);
            box-shadow: 0 0 28px rgba(212,255,88,.35); }
        .ad-kicker { margin: 0 0 8px; color: #dfff69; font-size: 12px; font-weight: 900; letter-spacing: .2em; text-transform: uppercase; }
        .ad-card h1 { margin: 0; font-size: clamp(30px, 8vw, 48px); line-height: .98; letter-spacing: -.05em; text-transform: uppercase; }
        .ad-card p { margin: 16px auto 19px; max-width: 280px; color: #d8e7d5; font-size: 15px; line-height: 1.35; }
        .ad-card .ad-link { width: 100%; min-height: 48px; margin: 0 0 12px; font-size: 15px; }
        .ad-card .ad-link:last-child { margin-bottom: 0; }
        #sound-toggle { position: absolute; z-index: 20; right: 12px; bottom: max(12px, env(safe-area-inset-bottom));
            width: auto; margin: 0; padding: 8px 11px; border-radius: 12px; background: rgba(8,22,18,.78); color: white; font-size: 12px; }
        @media (max-height: 520px) { .ad-card { padding: 15px 20px; } .ad-orb { width: 48px; height: 48px; margin-bottom: 9px; } .ad-card p { margin: 9px auto 12px; } }
        @media (max-width: 340px) { .ad-brand strong { font-size: 12px; } .ad-link { min-width: 95px; padding: 9px 7px; font-size: 10px; } }
    </style>
    <script src="vendor/three.min.js"></script>
    <script src="vendor/cannon.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="ad-topbar">
        <div class="ad-brand" aria-live="polite">
            <strong>HOLE<span>EATER</span></strong>
            <small id="ad-progress">Level 1/10</small>
            <div class="ad-meter"><span id="ad-meter-fill"></span></div>
        </div>
    </div>
    <button type="button" id="sound-toggle" aria-label="Turn sound on">Sound off</button>

    <div id="ad-intro" class="ad-overlay">
        <div class="ad-card">
            <div class="ad-orb" aria-hidden="true"></div>
            <div class="ad-kicker">Ten worlds to clear</div>
            <h1>Eat. Grow. Win.</h1>
            <p>Drag the hole to swallow every block and clear all ten levels.</p>
            <button type="button" id="ad-start" class="ad-link">Tap to play →</button>
        </div>
    </div>

    <div id="ad-level-complete" class="ad-overlay" hidden>
        <div class="ad-card">
            <div class="ad-orb" aria-hidden="true"></div>
            <div class="ad-kicker" id="ad-level-count">Level 1 of 10</div>
            <h1>Level cleared!</h1>
            <p id="ad-next-label">The next world awaits.</p>
            <button type="button" id="ad-next" class="ad-link">Next level →</button>
        </div>
    </div>

    <div id="ad-endcard" class="ad-overlay" hidden>
        <div class="ad-card">
            <div class="ad-orb" aria-hidden="true"></div>
            <div class="ad-kicker">All ten levels cleared</div>
            <h1>You beat the game!</h1>
            <p>Explore more from RmaN or check out the code.</p>
            <button type="button" class="ad-link" data-ad-url="https://rman.online">Explore rman.online ↗</button>
            <button type="button" class="ad-link secondary" data-ad-url="https://github.com/RmaNMetaverse">View GitHub ↗</button>
        </div>
    </div>

    <script>
        // --- Game Variables ---
        let scene, camera, renderer, world;
        let groundMesh, groundBody, holeMesh;
        let cubes = [];
        let decorations = [];
        let mouse = new THREE.Vector2();
        let raycaster = new THREE.Raycaster();
        let groundPlane; // Mathematical plane for raycasting

        // --- Gameplay Stats ---
        let isPlaying = true;
        let score = 0;
        let sizeLevel = 1;
        let baseRadius = 0.5; // VERY SMALL INITIAL SIZE
        let currentRadius = baseRadius;
        let lastScaleScore = 0;

        // Dynamic Level Management System
        let currentLevelIndex = 0;

        // --- Audio System Variables ---
        let audioCtx;
        let lastEatSoundTime = 0;
        let soundEnabled = false;
        let adStarted = false;
        let adViewable = !window.mraid;
        let adFinished = false;
        let levelTotal = 0;

        // Constants
        const CUBE_GROUP = 1;
        const GROUND_GROUP = 2;

        document.addEventListener('DOMContentLoaded', function() {
            initEngine();
            setupAd();
            startLevel();
            setupMraid();
            animate();
        });

        function setupMraid() {
            const bridge = window.mraid;
            if (!bridge || typeof bridge.getState !== 'function') {
                adViewable = true;
                return;
            }
            const ready = () => {
                bridge.addEventListener('viewableChange', setAdViewable);
                setAdViewable(bridge.isViewable());
            };
            if (bridge.getState() === 'loading') bridge.addEventListener('ready', ready);
            else ready();
        }

        function setAdViewable(viewable) {
            adViewable = !!viewable;
            if (audioCtx) {
                if (!adViewable && audioCtx.state === 'running') audioCtx.suspend();
                else if (adViewable && soundEnabled && audioCtx.state === 'suspended') audioCtx.resume();
            }
        }

        function openAdUrl(url) {
            // The final end card is the only clickthrough surface.
            if (!adFinished) return;
            if (url !== 'https://rman.online' && url !== 'https://github.com/RmaNMetaverse') return;
            if (window.mraid && typeof window.mraid.open === 'function') {
                window.mraid.open(url);
            } else {
                window.open(url, '_blank', 'noopener,noreferrer');
            }
        }

        function setupAd() {
            document.querySelectorAll('[data-ad-url]').forEach(button => {
                button.addEventListener('click', () => openAdUrl(button.dataset.adUrl));
            });
            document.getElementById('ad-start').addEventListener('click', () => {
                adStarted = true;
                document.getElementById('ad-intro').hidden = true;
            });
            document.getElementById('ad-next').addEventListener('click', () => {
                if (isPlaying || adFinished || currentLevelIndex >= levels.length - 1) return;
                currentLevelIndex++;
                startLevel();
            });
            document.getElementById('sound-toggle').addEventListener('click', () => {
                if (!audioCtx) initAudio();
                if (!audioCtx) return;
                soundEnabled = !soundEnabled;
                if (soundEnabled && adViewable) audioCtx.resume();
                else audioCtx.suspend();
                const toggle = document.getElementById('sound-toggle');
                toggle.textContent = soundEnabled ? 'Sound on' : 'Sound off';
                toggle.setAttribute('aria-label', soundEnabled ? 'Turn sound off' : 'Turn sound on');
            });
        }

        function initAudio() {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            audioCtx = new AudioContext();
        }

        function playEatSound() {
            if (!audioCtx || audioCtx.state === 'suspended') return;
            if (audioCtx.currentTime - lastEatSoundTime < 0.04) return;
            lastEatSoundTime = audioCtx.currentTime;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(300 + Math.random() * 100, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.05);

            gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        function playGrowSound() {
            if (!audioCtx || audioCtx.state === 'suspended') return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.3);

            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        function playVictorySound() {
            if (!audioCtx || audioCtx.state === 'suspended') return;

            [300, 375, 450, 600].forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'square';
                osc.frequency.value = freq;

                let startTime = audioCtx.currentTime + i * 0.1;
                gain.gain.setValueAtTime(0, startTime);
                gain.gain.linearRampToValueAtTime(0.08, startTime + 0.05);
                gain.gain.linearRampToValueAtTime(0, startTime + 0.3);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(startTime);
                osc.stop(startTime + 0.3);
            });
        }

        function initEngine() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x8fce00);
            scene.fog = new THREE.Fog(0x8fce00, 20, 60);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, window.innerWidth / window.innerHeight < 0.8 ? 34 : 25,
                window.innerWidth / window.innerHeight < 0.8 ? 26 : 20);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 30, 10);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 1024;
            dirLight.shadow.mapSize.height = 1024;
            dirLight.shadow.camera.left = -20;
            dirLight.shadow.camera.right = 20;
            dirLight.shadow.camera.top = 20;
            dirLight.shadow.camera.bottom = -20;
            scene.add(dirLight);

            world = new CANNON.World();
            world.gravity.set(0, -9.82, 0);
            world.broadphase = new CANNON.NaiveBroadphase();
            world.solver.iterations = 20;

            const physicsMaterial = new CANNON.Material("standard");
            const physicsContactMaterial = new CANNON.ContactMaterial(
                physicsMaterial, physicsMaterial,
                { friction: 0.6, restitution: 0.0 } // Prevent physics explosions
            );
            world.addContactMaterial(physicsContactMaterial);

            const groundGeo = new THREE.PlaneGeometry(200, 200);
            const groundMat = new THREE.MeshLambertMaterial({ color: 0x8fce00 });
            groundMesh = new THREE.Mesh(groundGeo, groundMat);
            groundMesh.rotation.x = -Math.PI / 2;
            groundMesh.receiveShadow = true;
            scene.add(groundMesh);

            const groundShape = new CANNON.Plane();
            groundBody = new CANNON.Body({ mass: 0, material: physicsMaterial });
            groundBody.addShape(groundShape);
            groundBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
            groundBody.collisionFilterGroup = GROUND_GROUP;
            world.addBody(groundBody);

            const holeGeo = new THREE.CircleGeometry(1, 32);
            const holeMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
            holeMesh = new THREE.Mesh(holeGeo, holeMat);
            holeMesh.rotation.x = -Math.PI / 2;
            holeMesh.position.y = 0.08;
            holeMesh.renderOrder = 10;
            holeMesh.scale.set(currentRadius, currentRadius, 1);
            scene.add(holeMesh);

            groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

            window.addEventListener('resize', onWindowResize);
            document.addEventListener('mousemove', onPointerMove);
            document.addEventListener('touchmove', onPointerMove, { passive: false });
        }

        function onPointerMove(event) {
            let clientX = event.clientX;
            let clientY = event.clientY;

            if (event.touches && event.touches.length > 0) {
                clientX = event.touches[0].clientX;
                clientY = event.touches[0].clientY;
            }

            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.position.set(0, camera.aspect < 0.8 ? 34 : 25, camera.aspect < 0.8 ? 26 : 20);
            camera.lookAt(0, 0, 0);
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function startLevel() {
            let levelData = levels[currentLevelIndex];

            isPlaying = true;
            adFinished = false;
            score = 0;
            sizeLevel = 1;
            lastScaleScore = 0;
            currentRadius = baseRadius;

            // Update UI & Environment Dynamically
            scene.background.setHex(levelData.bgColor);
            scene.fog.color.setHex(levelData.bgColor);
            groundMesh.material.color.setHex(levelData.bgColor);

            document.getElementById('ad-endcard').hidden = true;
            document.getElementById('ad-level-complete').hidden = true;

            holeMesh.scale.set(currentRadius, currentRadius, 1);

            cubes.forEach(c => {
                scene.remove(c.mesh);
                world.remove(c.body);
            });
            cubes = [];

            decorations.forEach(d => scene.remove(d));
            decorations = [];

            levelData.buildFunc();
            levelTotal = cubes.length;
            updateAdProgress();

        }

        function updateAdProgress() {
            document.getElementById('ad-progress').textContent =
                `Level ${currentLevelIndex + 1}/${levels.length} · ${cubes.length} left`;
            document.getElementById('ad-meter-fill').style.width =
                `${levelTotal ? (1 - cubes.length / levelTotal) * 100 : 100}%`;
        }

        // Shared Geometry and Shape to improve web performance with many blocks
        const cubeSize = 0.4;
        const spacing = 0.42;
        const boxGeo = new THREE.BoxGeometry(cubeSize, cubeSize, cubeSize);
        const boxShape = new CANNON.Box(new CANNON.Vec3(cubeSize/2, cubeSize/2, cubeSize/2));
        const mMult = 3;
        const mSpacing = spacing * mMult;
        const mCubeSize = cubeSize * mMult;
        const largeBoxGeo = new THREE.BoxGeometry(mCubeSize, mCubeSize, mCubeSize);
        const largeBoxShape = new CANNON.Box(new CANNON.Vec3(mCubeSize/2, mCubeSize/2, mCubeSize/2));

        const materials = {
            // Level 1
            wood: new THREE.MeshLambertMaterial({ color: 0x8B4513 }),
            sand: new THREE.MeshLambertMaterial({ color: 0xEEDD82 }),
            slideBlue: new THREE.MeshLambertMaterial({ color: 0x4682B4 }),
            slideRed: new THREE.MeshLambertMaterial({ color: 0xFF4500 }),
            leaves: new THREE.MeshLambertMaterial({ color: 0x228B22 }),
            trunk: new THREE.MeshLambertMaterial({ color: 0x5C4033 }),
            gym1: new THREE.MeshLambertMaterial({ color: 0xFFD700 }),
            gym2: new THREE.MeshLambertMaterial({ color: 0xFF69B4 }),
            blackRubber: new THREE.MeshLambertMaterial({ color: 0x222222 }),
            metalGray: new THREE.MeshLambertMaterial({ color: 0x999999 }),

            // Level 2 (Airplanes / Airport)
            planeWhite: new THREE.MeshLambertMaterial({ color: 0xFAFAFA }),
            planeRed: new THREE.MeshLambertMaterial({ color: 0xCC0000 }),
            planeBlue: new THREE.MeshLambertMaterial({ color: 0x0055AA }),
            glassBlue: new THREE.MeshLambertMaterial({ color: 0x88CCFF }),
            towerGray: new THREE.MeshLambertMaterial({ color: 0x999999 }),
            engineBlack: new THREE.MeshLambertMaterial({ color: 0x222222 }),
            heliGreen: new THREE.MeshLambertMaterial({ color: 0x4A5D23 }),

            // Level 3 (New York City)
            darkBuilding: new THREE.MeshLambertMaterial({ color: 0x111115 }),
            windowGlow: new THREE.MeshBasicMaterial({ color: 0xFFFF88 }),
            neonPink: new THREE.MeshBasicMaterial({ color: 0xFF00FF }),
            neonCyan: new THREE.MeshBasicMaterial({ color: 0x00FFFF }),
            concrete: new THREE.MeshLambertMaterial({ color: 0x888888 }),
            taxiYellow: new THREE.MeshLambertMaterial({ color: 0xFFD700 }),

            // Level 4 (Battlefield)
            sandDark: new THREE.MeshLambertMaterial({ color: 0xC2B280 }),
            camoGreen: new THREE.MeshLambertMaterial({ color: 0x4B5320 }),
            tankTreads: new THREE.MeshLambertMaterial({ color: 0x2F4F4F }),
            missileGray: new THREE.MeshLambertMaterial({ color: 0x708090 }),
            missileRed: new THREE.MeshLambertMaterial({ color: 0x8B0000 }),

            // Level 5 (Sugar Rush / Candyland)
            cakeChoco: new THREE.MeshLambertMaterial({ color: 0x4B3621 }),
            cakeVanilla: new THREE.MeshLambertMaterial({ color: 0xF3E5AB }),
            frostingPink: new THREE.MeshLambertMaterial({ color: 0xFF69B4 }),
            coneWafer: new THREE.MeshLambertMaterial({ color: 0xD2B48C }),
            candyRed: new THREE.MeshLambertMaterial({ color: 0xFF0000 }),
            candyCyan: new THREE.MeshLambertMaterial({ color: 0x00FFFF }),
            candyPurple: new THREE.MeshLambertMaterial({ color: 0x9370DB }),
            stickWhite: new THREE.MeshLambertMaterial({ color: 0xFFFFFF }),

            // Level 6 (Guitar Center)
            guitarSunburst: new THREE.MeshLambertMaterial({ color: 0xFF8C00 }),
            woodDark: new THREE.MeshLambertMaterial({ color: 0x3d2314 }),
            metalGold: new THREE.MeshLambertMaterial({ color: 0xFFD700 }),

            // Level 7 (Lush Forest)
            leafDark: new THREE.MeshLambertMaterial({ color: 0x1E4D2B }),
            leafLight: new THREE.MeshLambertMaterial({ color: 0x4C9A2A }),
            woodPine: new THREE.MeshLambertMaterial({ color: 0x4A3728 }),
            stoneGray: new THREE.MeshLambertMaterial({ color: 0x808080 }),

            // Level 8 (Disney Land)
            mickeyBlack: new THREE.MeshLambertMaterial({ color: 0x111111 }),
            castlePink: new THREE.MeshLambertMaterial({ color: 0xFFB6C1 }),
            castleBlue: new THREE.MeshLambertMaterial({ color: 0x4169E1 }),
            magicGold: new THREE.MeshLambertMaterial({ color: 0xFFD700 }),

            // Level 9 (Sea World)
            waterBlue: new THREE.MeshLambertMaterial({ color: 0x006994 }),
            shipWood: new THREE.MeshLambertMaterial({ color: 0x5C4033 }),
            sailWhite: new THREE.MeshLambertMaterial({ color: 0xF5F5F5 }),
            mastBlack: new THREE.MeshLambertMaterial({ color: 0x222222 }),

            // Level 10 (Race Track)
            asphalt: new THREE.MeshLambertMaterial({ color: 0x333333 }),
            curbRed: new THREE.MeshLambertMaterial({ color: 0xCC0000 }),
            curbWhite: new THREE.MeshLambertMaterial({ color: 0xEEEEEE }),
            ferrariRed: new THREE.MeshLambertMaterial({ color: 0xFF2800 }),
            bugattiBlue: new THREE.MeshLambertMaterial({ color: 0x0055FF }),
            f1Body: new THREE.MeshLambertMaterial({ color: 0xBB0000 }),
            f1Wing: new THREE.MeshLambertMaterial({ color: 0x111111 }),
            tireBlack: new THREE.MeshLambertMaterial({ color: 0x151515 }),
            glassDark: new THREE.MeshLambertMaterial({ color: 0x222222 })
        };

        function spawnCube(x, y, z, material) {
            let mesh = new THREE.Mesh(boxGeo, material);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);

            let body = new CANNON.Body({ mass: 0, type: CANNON.Body.STATIC });
            body.addShape(boxShape);
            body.position.set(x, y, z);

            body.linearDamping = 0.5;
            body.angularDamping = 0.5;

            body.collisionFilterGroup = CUBE_GROUP;
            body.collisionFilterMask = CUBE_GROUP | GROUND_GROUP;
            world.addBody(body);

            cubes.push({
                mesh: mesh,
                body: body,
                isFalling: false,
                isLargeBlock: false
            });
        }

        function spawnLargeCube(x, y, z, material) {
            let mesh = new THREE.Mesh(largeBoxGeo, material);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);

            let body = new CANNON.Body({ mass: 0, type: CANNON.Body.STATIC });
            body.addShape(largeBoxShape);
            body.position.set(x, y, z);

            body.linearDamping = 0.6;
            body.angularDamping = 0.6;

            body.collisionFilterGroup = CUBE_GROUP;
            body.collisionFilterMask = CUBE_GROUP | GROUND_GROUP;
            world.addBody(body);

            cubes.push({
                mesh: mesh,
                body: body,
                isFalling: false,
                isLargeBlock: true
            });
        }

        function spawnDecorationTexturedPlane(x, y, z, width, depth, colorCode) {
            const geo = new THREE.PlaneGeometry(width, depth);
            const mat = new THREE.MeshBasicMaterial({ color: colorCode });
            let mesh = new THREE.Mesh(geo, mat);
            mesh.rotation.x = -Math.PI / 2;
            mesh.position.set(x, y, z);
            mesh.renderOrder = 1;
            scene.add(mesh);
            decorations.push(mesh);
        }

        // ==========================================
        // LEVEL MANAGER CONFIGURATION
        // ==========================================
        const levels = [
            {
                title: "Playground",
                bgColor: 0x8fce00, // Grass green
                buildFunc: buildPlayground,
                threshold: 15
            },
            {
                title: "Airport",
                bgColor: 0x4a4a4a, // Tarmac gray
                buildFunc: buildAirport,
                threshold: 20
            },
            {
                title: "New York City",
                bgColor: 0x1a1a2e, // Evening twilight sky
                buildFunc: buildNewYork,
                threshold: 25
            },
            {
                title: "Battlefield",
                bgColor: 0xE6D0AB, // Desert sand color
                buildFunc: buildBattlefield,
                threshold: 24
            },
            {
                title: "Sugar Rush",
                bgColor: 0xFFB6C1, // Light pink frosting background
                buildFunc: buildCandyland,
                threshold: 21
            },
            {
                title: "Guitar Center",
                bgColor: 0x2A1B38, // Vibrant deep purple
                buildFunc: buildGuitarCenter,
                threshold: 22
            },
            {
                title: "Lush Forest",
                bgColor: 0x243b25, // Deep forest green
                buildFunc: buildLushForest,
                threshold: 18
            },
            {
                title: "Disney Land",
                bgColor: 0x191970, // Midnight magic blue
                buildFunc: buildDisneyLand,
                threshold: 20 // Updated as per request
            },
            {
                title: "Sea World",
                bgColor: 0x006994, // Deep ocean blue
                buildFunc: buildSeaWorld,
                threshold: 25 // Ships contain lots of small cubes, nicely balanced
            },
            {
                title: "Race Track",
                bgColor: 0x333333, // Asphalt dark gray
                buildFunc: buildRaceTrack,
                threshold: 15 // Dense with detailed cars and barriers
            }
        ];

        // ==========================================
        // LEVEL 1: PLAYGROUND BUILDERS
        // ==========================================
        function buildPlayground() {
            // Re-arranged layout for much better spacing
            buildSandbox(-7, 0, -6);
            buildSwingSet(-1, 0, -6);
            buildToyCar(5, 0, -6);

            buildSlide(2, 0, 1);
            buildSeesaw(-4, 0, 3);
            buildPyramid(4, 0, 5);

            buildTree(-8, 0, 5);
            buildTree(8, 0, -2);
        }

        function buildSandbox(offsetX, offsetY, offsetZ) {
            for(let x = 0; x < 8; x++) {
                for(let z = 0; z < 8; z++) {
                    let isBorder = (x === 0 || x === 7 || z === 0 || z === 7);
                    let posX = offsetX + x * spacing;
                    let posZ = offsetZ + z * spacing;

                    if (isBorder) {
                        spawnCube(posX, offsetY + 0.5, posZ, materials.wood);
                        spawnCube(posX, offsetY + 0.5 + spacing, posZ, materials.wood);
                    } else {
                        spawnCube(posX, offsetY + 0.5, posZ, materials.sand);
                    }
                }
            }
        }

        function buildSlide(offsetX, offsetY, offsetZ) {
            for(let z = 0; z < 3; z++) {
                for(let x = 0; x < 10; x++) {
                    let posX = offsetX + x * spacing;
                    let posZ = offsetZ + z * spacing;

                    if (x < 2) {
                        for(let y = 0; y < 6; y++) spawnCube(posX, offsetY + 0.5 + y * spacing, posZ, materials.slideBlue);
                    } else if (x >= 2 && x < 4) {
                        spawnCube(posX, offsetY + 0.5 + 5 * spacing, posZ, materials.slideBlue);
                    } else {
                        let slopeHeight = Math.floor(5 - (x - 4) * (5 / 6));
                        if(slopeHeight >= 0) spawnCube(posX, offsetY + 0.5 + slopeHeight * spacing, posZ, materials.slideRed);
                    }
                }
            }
        }

        function buildTree(offsetX, offsetY, offsetZ) {
            for(let y = 0; y < 5; y++) {
                for(let x = 0; x < 2; x++) {
                    for(let z = 0; z < 2; z++) {
                        spawnCube(offsetX + x * spacing, offsetY + 0.5 + y * spacing, offsetZ + z * spacing, materials.trunk);
                    }
                }
            }
            for(let y = 5; y < 9; y++) {
                let w = y === 8 ? 2 : 4;
                let offset = y === 8 ? 0 : -1;
                for(let x = 0; x < w; x++) {
                    for(let z = 0; z < w; z++) {
                        if (y !== 8 && ((x===0&&z===0) || (x===0&&z===w-1) || (x===w-1&&z===0) || (x===w-1&&z===w-1))) continue;
                        spawnCube(offsetX + offset * spacing + x * spacing, offsetY + 0.5 + y * spacing, offsetZ + offset * spacing + z * spacing, materials.leaves);
                    }
                }
            }
        }

        function buildPyramid(offsetX, offsetY, offsetZ) {
            let layers = 4;
            for(let y = 0; y < layers; y++) {
                let size = (layers - y) * 2;
                let mat = y % 2 === 0 ? materials.gym1 : materials.gym2;
                for(let x = 0; x < size; x++) {
                    for(let z = 0; z < size; z++) {
                        spawnCube(offsetX + x * spacing + y * spacing, offsetY + 0.5 + y * spacing, offsetZ + z * spacing + y * spacing, mat);
                    }
                }
            }
        }

        function buildSwingSet(offsetX, offsetY, offsetZ) {
            for(let y=0; y<6; y++) {
                spawnCube(offsetX - 3*spacing, offsetY + 0.5 + y*spacing, offsetZ, materials.metalGray);
                spawnCube(offsetX + 3*spacing, offsetY + 0.5 + y*spacing, offsetZ, materials.metalGray);
            }
            for(let x=-2; x<=2; x++) {
                spawnCube(offsetX + x*spacing, offsetY + 0.5 + 5*spacing, offsetZ, materials.slideRed);
            }
            for(let y=2; y<5; y++) {
                spawnCube(offsetX - 1.5*spacing, offsetY + 0.5 + y*spacing, offsetZ, materials.metalGray);
                spawnCube(offsetX + 1.5*spacing, offsetY + 0.5 + y*spacing, offsetZ, materials.metalGray);
            }
            spawnCube(offsetX - 1.5*spacing, offsetY + 0.5 + 1*spacing, offsetZ, materials.wood);
            spawnCube(offsetX + 1.5*spacing, offsetY + 0.5 + 1*spacing, offsetZ, materials.wood);
        }

        function buildSeesaw(offsetX, offsetY, offsetZ) {
            spawnCube(offsetX, offsetY + 0.5, offsetZ, materials.gym1);
            spawnCube(offsetX, offsetY + 0.5 + spacing, offsetZ, materials.gym1);
            for(let x=-3; x<=3; x++) {
                spawnCube(offsetX + x*spacing, offsetY + 0.5 + 2*spacing, offsetZ, materials.wood);
            }
        }

        function buildToyCar(offsetX, offsetY, offsetZ) {
            for(let x=0; x<3; x++) {
                for(let z=0; z<2; z++) {
                    spawnCube(offsetX + x*spacing, offsetY + 0.5 + spacing, offsetZ + z*spacing, materials.slideBlue);
                }
            }
            spawnCube(offsetX + 1*spacing, offsetY + 0.5 + 2*spacing, offsetZ, materials.slideRed);
            spawnCube(offsetX + 1*spacing, offsetY + 0.5 + 2*spacing, offsetZ + spacing, materials.slideRed);
            spawnCube(offsetX, offsetY + 0.5, offsetZ - spacing, materials.blackRubber);
            spawnCube(offsetX + 2*spacing, offsetY + 0.5, offsetZ - spacing, materials.blackRubber);
            spawnCube(offsetX, offsetY + 0.5, offsetZ + 2*spacing, materials.blackRubber);
            spawnCube(offsetX + 2*spacing, offsetY + 0.5, offsetZ + 2*spacing, materials.blackRubber);
        }

        // ==========================================
        // LEVEL 2: AIRPORT BUILDERS
        // ==========================================
        function buildAirport() {
            spawnDecorationTexturedPlane(-2, 0.01, 0, 8, 50, 0x222222);
            for (let z = -20; z < 20; z += 4) {
                spawnDecorationTexturedPlane(-2, 0.02, z, 0.6, 2, 0xFFFFFF);
            }

            buildControlTower(8, 0, -8);
            buildBoeing747(-3, 0, -5, materials.planeBlue);
            buildBoeing747(6, 0, 5, materials.planeRed);

            buildHelicopter(-7, 0, 8);
            buildHelicopter(-9, 0, 3);
        }

        function buildControlTower(offsetX, offsetY, offsetZ) {
            for(let y = 0; y < 8; y++) {
                for(let x = 0; x < 3; x++) {
                    for(let z = 0; z < 3; z++) {
                        spawnCube(offsetX + x * spacing, offsetY + 0.5 + y * spacing, offsetZ + z * spacing, materials.towerGray);
                    }
                }
            }
            for(let y = 8; y < 10; y++) {
                for(let x = -1; x < 4; x++) {
                    for(let z = -1; z < 4; z++) {
                        if (x > 0 && x < 2 && z > 0 && z < 2) continue;
                        spawnCube(offsetX + x * spacing, offsetY + 0.5 + y * spacing, offsetZ + z * spacing, materials.glassBlue);
                    }
                }
            }
            for(let x = -1; x < 4; x++) {
                for(let z = -1; z < 4; z++) {
                    spawnCube(offsetX + x * spacing, offsetY + 0.5 + 10 * spacing, offsetZ + z * spacing, materials.towerGray);
                }
            }
            spawnCube(offsetX + 1 * spacing, offsetY + 0.5 + 11 * spacing, offsetZ + 1 * spacing, materials.planeRed);
            spawnCube(offsetX + 1 * spacing, offsetY + 0.5 + 12 * spacing, offsetZ + 1 * spacing, materials.planeRed);
        }

        function buildBoeing747(offsetX, offsetY, offsetZ, accentMat) {
            for(let x = 0; x < 15; x++) {
                for(let y = 1; y < 4; y++) {
                    for(let z = 0; z < 3; z++) {
                        if (x > 1 && x < 13 && y === 2 && z === 1) continue;

                        let mat = materials.planeWhite;
                        if (x === 0 && y === 2) mat = materials.glassBlue;
                        if (x > 12) mat = accentMat;

                        spawnCube(offsetX + x * spacing, offsetY + 0.5 + y * spacing, offsetZ + z * spacing, mat);
                    }
                }
            }

            for(let x = 2; x < 6; x++) {
                for(let z = 0; z < 3; z++) {
                    let mat = materials.planeWhite;
                    if(x === 2) mat = materials.glassBlue;
                    spawnCube(offsetX + x * spacing, offsetY + 0.5 + 4 * spacing, offsetZ + z * spacing, mat);
                }
            }

            for(let x = 5; x < 10; x++) {
                let leftZ = -(x - 4);
                for(let z = leftZ; z < 0; z++) {
                    spawnCube(offsetX + x * spacing, offsetY + 0.5 + 1 * spacing, offsetZ + z * spacing, materials.planeWhite);
                }
                let rightZ = 2 + (x - 4);
                for(let z = 3; z <= rightZ; z++) {
                    spawnCube(offsetX + x * spacing, offsetY + 0.5 + 1 * spacing, offsetZ + z * spacing, materials.planeWhite);
                }

                if (x === 6 || x === 8) {
                    spawnCube(offsetX + x * spacing, offsetY + 0.5 + 0 * spacing, offsetZ + (leftZ + 1) * spacing, materials.engineBlack);
                    spawnCube(offsetX + x * spacing, offsetY + 0.5 + 0 * spacing, offsetZ + (rightZ - 1) * spacing, materials.engineBlack);
                }
            }

            for(let x = 12; x < 15; x++) {
                for(let y = 4; y < 7; y++) {
                    if (x - 11 >= y - 3) {
                        spawnCube(offsetX + x * spacing, offsetY + 0.5 + y * spacing, offsetZ + 1 * spacing, accentMat);
                    }
                }
                spawnCube(offsetX + x * spacing, offsetY + 0.5 + 2 * spacing, offsetZ - 1 * spacing, materials.planeWhite);
                spawnCube(offsetX + x * spacing, offsetY + 0.5 + 2 * spacing, offsetZ + 3 * spacing, materials.planeWhite);
            }
        }

        function buildHelicopter(offsetX, offsetY, offsetZ) {
            for(let x=0; x<4; x++) {
                for(let y=1; y<4; y++) {
                    for(let z=0; z<3; z++) {
                        let mat = materials.heliGreen;
                        if(x===0 && y===2) mat = materials.glassBlue;
                        spawnCube(offsetX + x * spacing, offsetY + 0.5 + y * spacing, offsetZ + z * spacing, mat);
                    }
                }
            }
            for(let x=4; x<9; x++) {
                spawnCube(offsetX + x * spacing, offsetY + 0.5 + 2 * spacing, offsetZ + 1 * spacing, materials.heliGreen);
            }
            spawnCube(offsetX + 8 * spacing, offsetY + 0.5 + 3 * spacing, offsetZ + 1 * spacing, materials.engineBlack);
            spawnCube(offsetX + 8 * spacing, offsetY + 0.5 + 1 * spacing, offsetZ + 1 * spacing, materials.engineBlack);

            spawnCube(offsetX + 2 * spacing, offsetY + 0.5 + 4 * spacing, offsetZ + 1 * spacing, materials.towerGray);
            for(let i=-2; i<=6; i++) {
                spawnCube(offsetX + i * spacing, offsetY + 0.5 + 5 * spacing, offsetZ + 1 * spacing, materials.engineBlack);
                spawnCube(offsetX + 2 * spacing, offsetY + 0.5 + 5 * spacing, offsetZ + (i-1) * spacing, materials.engineBlack);
            }
        }

        // ==========================================
        // LEVEL 3: NEW YORK CITY BUILDERS
        // ==========================================
        function buildNewYork() {
            // Street Grids (Asphalt)
            spawnDecorationTexturedPlane(0, 0.01, 0, 40, 40, 0x111111);
            // Crosswalks / Road lines
            for (let i = -15; i <= 15; i += 5) {
                spawnDecorationTexturedPlane(i, 0.02, 0, 0.2, 40, 0xDDDDDD); // Vertical lines
                spawnDecorationTexturedPlane(0, 0.02, i, 40, 0.2, 0xDDDDDD); // Horizontal lines
            }

            // Times Square in the center
            buildTimesSquare(0, 0);

            // Iconic Skyline
            buildEmpireTower(-8, -8);
            buildEmpireTower(8, 8);
            buildChryslerTower(8, -8);
            buildChryslerTower(-8, 8);

            // Standard Skyscrapers
            buildNYSkyscraper(-12, 0, 4, 4, 10);
            buildNYSkyscraper(12, 0, 4, 4, 12);
            buildNYSkyscraper(0, -12, 5, 3, 8);

            // Scatter Yellow Taxis
            buildTaxi(-4, -2, false);
            buildTaxi(4, 2, true);
            buildTaxi(-2, 8, false);
            buildTaxi(10, -2, true);
            buildTaxi(-10, -4, false);
        }

        function buildTimesSquare(offsetX, offsetZ) {
            // A bright glowing centerpiece building
            for(let y=0; y<10; y++) {
                for(let x=-2; x<=2; x++) {
                    for(let z=-2; z<=2; z++) {
                        if (Math.abs(x)===2 && Math.abs(z)===2) continue; // Round off
                        if (x===0 && z===0) continue; // Hollow core

                        let mat = materials.darkBuilding;
                        // Massive glowing billboards
                        if (y > 2 && y < 8 && (Math.abs(x)===2 || Math.abs(z)===2)) {
                            let r = Math.random();
                            if (r > 0.6) mat = materials.neonCyan;
                            else if (r > 0.3) mat = materials.neonPink;
                            else mat = materials.windowGlow;
                        }
                        spawnCube(offsetX + x*spacing, 0.5 + y*spacing, offsetZ + z*spacing, mat);
                    }
                }
            }
            // Antenna on top
            spawnCube(offsetX, 0.5 + 10*spacing, offsetZ, materials.metalGray);
            spawnCube(offsetX, 0.5 + 11*spacing, offsetZ, materials.windowGlow);
        }

        function buildEmpireTower(offsetX, offsetZ) {
            // Base (wide)
            for(let y=0; y<6; y++) {
                for(let x=-2; x<=2; x++) {
                    for(let z=-2; z<=2; z++) {
                        if (Math.abs(x)<2 && Math.abs(z)<2) continue; // Hollow
                        let mat = (y%2!==0 && (x===0||z===0)) ? materials.windowGlow : materials.concrete;
                        spawnCube(offsetX + x*spacing, 0.5 + y*spacing, offsetZ + z*spacing, mat);
                    }
                }
            }
            // Mid (narrower)
            for(let y=6; y<12; y++) {
                for(let x=-1; x<=1; x++) {
                    for(let z=-1; z<=1; z++) {
                        if (x===0 && z===0) continue; // Hollow
                        let mat = (y%2!==0 && (x===0||z===0)) ? materials.windowGlow : materials.concrete;
                        spawnCube(offsetX + x*spacing, 0.5 + y*spacing, offsetZ + z*spacing, mat);
                    }
                }
            }
            // Spire
            for(let y=12; y<16; y++) {
                spawnCube(offsetX, 0.5 + y*spacing, offsetZ, materials.metalGray);
            }
        }

        function buildChryslerTower(offsetX, offsetZ) {
            // Base
            for(let y=0; y<8; y++) {
                for(let x=-2; x<=2; x++) {
                    for(let z=-2; z<=2; z++) {
                        if (Math.abs(x)<2 && Math.abs(z)<2) continue; // Hollow
                        let mat = materials.concrete;
                        if (y%3===0 && (x===1 || z===1)) mat = materials.windowGlow;
                        spawnCube(offsetX + x*spacing, 0.5 + y*spacing, offsetZ + z*spacing, mat);
                    }
                }
            }
            // Terraced Crown (Iconic metallic arches)
            for(let y=8; y<11; y++) {
                let r = 11 - y; // 3, 2, 1
                for(let x=-r; x<=r; x++) {
                    for(let z=-r; z<=r; z++) {
                        if (x===0 && z===0 && y!==10) continue;
                        spawnCube(offsetX + x*spacing, 0.5 + y*spacing, offsetZ + z*spacing, materials.metalGray);
                    }
                }
            }
            // Spire
            for(let y=11; y<15; y++) {
                spawnCube(offsetX, 0.5 + y*spacing, offsetZ, materials.metalGray);
            }
        }

        function buildNYSkyscraper(offsetX, offsetZ, widthL, depthL, heightL) {
            for(let y=0; y<heightL; y++) {
                for(let x=0; x<widthL; x++) {
                    for(let z=0; z<depthL; z++) {
                        if (x>0 && x<widthL-1 && z>0 && z<depthL-1) continue; // Hollow

                        let mat = materials.darkBuilding;
                        if (y%2!==0 && (x===1 || z===1)) mat = materials.windowGlow;

                        spawnCube(offsetX + x*spacing, 0.5 + y*spacing, offsetZ + z*spacing, mat);
                    }
                }
            }
        }

        function buildTaxi(offsetX, offsetZ, isRotated) {
            for(let x=0; x<3; x++) {
                for(let z=0; z<2; z++) {
                    let rx = isRotated ? z : x;
                    let rz = isRotated ? x : z;
                    spawnCube(offsetX + rx*spacing, 0.5, offsetZ + rz*spacing, materials.taxiYellow);
                }
            }
            // Cabin
            spawnCube(offsetX + (isRotated?0:1)*spacing, 0.5 + spacing, offsetZ + (isRotated?1:0)*spacing, materials.glassDark);
            spawnCube(offsetX + (isRotated?1:1)*spacing, 0.5 + spacing, offsetZ + (isRotated?0:1)*spacing, materials.glassDark);
        }

        // ==========================================
        // LEVEL 4: BATTLEFIELD BUILDERS
        // ==========================================
        function buildBattlefield() {
            buildMountain(-12, 0, -12, 3);
            buildMountain(8, 0, -10, 3);
            buildMountain(-10, 0, 8, 2);
            buildMountain(10, 0, 10, 4);
            buildMountain(0, 0, -14, 2);
            buildMountain(-2, 0, 12, 3);

            buildTank(-4, 0, -3);
            buildTank(5, 0, 3);
            buildTank(-6, 0, 2);

            buildMissile(2, 0, -4);
            buildMissile(-2, 0, 6);
            buildMissile(6, 0, -2);
            buildMissile(0, 0, 2);
            buildMissile(-8, 0, -2);
        }

        function buildMountain(offsetX, offsetY, offsetZ, height) {
            for(let y = 0; y < height; y++) {
                let width = height - y;
                for(let x = -width; x <= width; x++) {
                    for(let z = -width; z <= width; z++) {
                        if (Math.abs(x) + Math.abs(z) > width + 1) continue;
                        let mat = (Math.random() > 0.5) ? materials.sand : materials.sandDark;
                        spawnLargeCube(offsetX + x * mSpacing, offsetY + 0.8 + y * mSpacing, offsetZ + z * mSpacing, mat);
                    }
                }
            }
        }

        function buildTank(offsetX, offsetY, offsetZ) {
            for(let x=0; x<6; x++) {
                for(let z=0; z<4; z+=3) {
                    spawnCube(offsetX + x*spacing, offsetY + 0.5, offsetZ + z*spacing, materials.tankTreads);
                    spawnCube(offsetX + x*spacing, offsetY + 0.5 + spacing, offsetZ + z*spacing, materials.tankTreads);
                }
            }
            for(let x=1; x<5; x++) {
                for(let z=1; z<3; z++) {
                    spawnCube(offsetX + x*spacing, offsetY + 0.5 + spacing, offsetZ + z*spacing, materials.camoGreen);
                    spawnCube(offsetX + x*spacing, offsetY + 0.5 + 2*spacing, offsetZ + z*spacing, materials.camoGreen);
                }
            }
            for(let x=2; x<4; x++) {
                for(let z=1; z<3; z++) {
                    spawnCube(offsetX + x*spacing, offsetY + 0.5 + 3*spacing, offsetZ + z*spacing, materials.camoGreen);
                }
            }
            for(let x=4; x<8; x++) {
                spawnCube(offsetX + x*spacing, offsetY + 0.5 + 3*spacing, offsetZ + 1.5*spacing, materials.tankTreads);
            }
        }

        function buildMissile(offsetX, offsetY, offsetZ) {
            for(let y=0; y<8; y++) {
                for(let x=0; x<2; x++) {
                    for(let z=0; z<2; z++) {
                        let mat = materials.missileGray;
                        if (y === 0) mat = materials.missileRed;
                        spawnCube(offsetX + x*spacing, offsetY + 0.5 + y*spacing, offsetZ + z*spacing, mat);
                    }
                }
            }
            spawnCube(offsetX + 0.5*spacing, offsetY + 0.5 + 8*spacing, offsetZ + 0.5*spacing, materials.missileRed);

            spawnCube(offsetX - spacing, offsetY + 0.5 + 0*spacing, offsetZ + 0.5*spacing, materials.missileRed);
            spawnCube(offsetX + 2*spacing, offsetY + 0.5 + 0*spacing, offsetZ + 0.5*spacing, materials.missileRed);
            spawnCube(offsetX + 0.5*spacing, offsetY + 0.5 + 0*spacing, offsetZ - spacing, materials.missileRed);
            spawnCube(offsetX + 0.5*spacing, offsetY + 0.5 + 0*spacing, offsetZ + 2*spacing, materials.missileRed);
        }

        // ==========================================
        // LEVEL 5: SUGAR RUSH BUILDERS
        // ==========================================
        function buildCandyland() {
            buildLayerCake(0, 0);
            let candyColors = [materials.candyRed, materials.candyCyan, materials.candyPurple, materials.frostingPink];

            for(let i=0; i<6; i++) {
                let angle = Math.random() * Math.PI * 2;
                let radius = 8 + Math.random() * 8;
                let x = Math.cos(angle) * radius;
                let z = Math.sin(angle) * radius;
                let randomColor = candyColors[Math.floor(Math.random() * candyColors.length)];
                buildIceCreamCone(x, z, randomColor);
            }

            for(let i=0; i<12; i++) {
                let x = (Math.random() - 0.5) * 30;
                let z = (Math.random() - 0.5) * 30;
                if(Math.abs(x) < 5 && Math.abs(z) < 5) continue;
                let randomColor = candyColors[Math.floor(Math.random() * 3)];
                buildLollipop(x, z, randomColor);
            }

            for(let i=0; i<80; i++) {
                let x = (Math.random() - 0.5) * 40;
                let z = (Math.random() - 0.5) * 40;
                if(Math.abs(x) < 3 && Math.abs(z) < 3) continue;
                let randomColor = candyColors[Math.floor(Math.random() * candyColors.length)];
                spawnCube(x, 0.5, z, randomColor);
            }
        }

        function buildLayerCake(offsetX, offsetZ) {
            for(let y=0; y<2; y++) {
                for(let x=-2; x<=2; x++) {
                    for(let z=-2; z<=2; z++) {
                        if(Math.abs(x)===2 && Math.abs(z)===2) continue;
                        spawnLargeCube(offsetX + x*mSpacing, 0.5 + y*mSpacing, offsetZ + z*mSpacing, materials.cakeChoco);
                    }
                }
            }
            for(let y=2; y<4; y++) {
                for(let x=-1; x<=1; x++) {
                    for(let z=-1; z<=1; z++) {
                        spawnLargeCube(offsetX + x*mSpacing, 0.5 + y*mSpacing, offsetZ + z*mSpacing, materials.cakeVanilla);
                    }
                }
            }
            let topYBase = 4 * mSpacing;

        // ==========================================
        // MAIN GAME LOGIC LOOP
        // ==========================================
        function handleGameLogic() {
            if (!isPlaying) return;
            raycaster.setFromCamera(mouse, camera);
            let target = new THREE.Vector3();
            raycaster.ray.intersectPlane(groundPlane, target);
            if (target) {
                holeMesh.position.x += (target.x - holeMesh.position.x) * 0.2;
                holeMesh.position.z += (target.z - holeMesh.position.z) * 0.2;
            }

            const thresholdSetting = levels[currentLevelIndex].threshold;
            const multiplierSetting = 1.1;

            for (let i = cubes.length - 1; i >= 0; i--) {
                let cube = cubes[i];

                cube.mesh.position.copy(cube.body.position);
                cube.mesh.quaternion.copy(cube.body.quaternion);

                let dx = cube.mesh.position.x - holeMesh.position.x;
                let dz = cube.mesh.position.z - holeMesh.position.z;
                let distance = Math.sqrt(dx*dx + dz*dz);

                let activationRadius = currentRadius * 3.5;
                if (cube.body.mass === 0 && distance < activationRadius) {
                    cube.body.mass = cube.isLargeBlock ? 2.5 : 0.5;
                    cube.body.type = CANNON.Body.DYNAMIC;
                    cube.body.updateMassProperties();
                    cube.body.wakeUp();
                }

                if (!cube.isFalling) {
                    let speed = cube.body.velocity.length();
                    if (speed > 12) {
                        cube.body.velocity.scale(12 / speed, cube.body.velocity);
                    }
                }

                let isOutOfBounds = cube.mesh.position.x > 25 ||
                                    cube.mesh.position.x < -25 ||
                                    cube.mesh.position.z > 18 ||
                                    cube.mesh.position.z < -25 ||
                                    cube.mesh.position.y > 15;

                // NEW MECHANIC: Determine if the hole is big enough for this block
                let requiredRadius = cube.isLargeBlock ? 0.6 : 0.2;

                if (!cube.isFalling && distance < currentRadius * 1.1) {
                    if (currentRadius >= requiredRadius) {
                        // SUCK IN
                        cube.isFalling = true;
                        cube.body.collisionFilterMask = CUBE_GROUP;
                    } else {
                        // REJECT: Block is too big!
                        // Pop it up and push it slightly outward to give physical "popcorn" feedback
                        if (cube.body.velocity.y < 0.5) {
                            cube.body.velocity.y = 2.5;
                            if (distance > 0.01) {
                                cube.body.velocity.x += (dx / distance) * 0.6;
                                cube.body.velocity.z += (dz / distance) * 0.6;
                            }
                        }
                    }
                }

                if (cube.isFalling) {
                    cube.body.velocity.x = -dx * 6;
                    cube.body.velocity.z = -dz * 6;
                    cube.body.velocity.y = -8;

                    if (cube.mesh.scale.x > 0.1) {
                        cube.mesh.scale.multiplyScalar(0.9);
                    }
                }

                if (cube.mesh.position.y < -3 || isOutOfBounds) {
                    scene.remove(cube.mesh);
                    world.remove(cube.body);
                    cubes.splice(i, 1);

                    score++;
                    updateAdProgress();
                    playEatSound();

                    // Check Growth
                    if (score - lastScaleScore >= thresholdSetting) {
                        sizeLevel++;
                        lastScaleScore = score;
                        currentRadius *= multiplierSetting;
                        holeMesh.scale.set(currentRadius, currentRadius, 1);
                        playGrowSound();
                    }

                    // Check Win Condition
                    if (cubes.length === 0 && isPlaying) {
                        if (currentLevelIndex === levels.length - 1) finishAd();
                        else showLevelComplete();
                        return;
                    }
                }
            }
        }

        function showLevelComplete() {
            isPlaying = false;
            document.getElementById('ad-level-count').textContent =
                `Level ${currentLevelIndex + 1} of ${levels.length}`;
            document.getElementById('ad-next-label').textContent =
                `${levels[currentLevelIndex + 1].title} is next.`;
            document.getElementById('ad-level-complete').hidden = false;
            playVictorySound();
        }

        function finishAd() {
            if (adFinished || currentLevelIndex !== levels.length - 1 || cubes.length !== 0) return;
            adFinished = true;
            isPlaying = false;
            document.getElementById('ad-endcard').hidden = false;
            document.getElementById('ad-progress').textContent = 'All levels complete!';
            document.getElementById('ad-meter-fill').style.width = '100%';
            playVictorySound();
        }

        function animate() {
            requestAnimationFrame(animate);
            if (!adViewable) return;
            if (adStarted && isPlaying) {
                world.step(1 / 60);
                handleGameLogic();
            }
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
